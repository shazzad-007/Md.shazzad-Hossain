  <style>

    :root {
      --bg: #07111f;
      --bg-soft: #0d1b2e;
      --card: rgba(255,255,255,0.055);
      --card-border: rgba(255,255,255,0.10);
      --text: #f4f7fb;
      --muted: #aab7c8;
      --accent: #d9b56d;
      --accent-light: #f2d79d;
      --blue: #5fa8ff;
      --white: #ffffff;
      --max: 1180px;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 80% 10%, rgba(95,168,255,.13), transparent 28%),
        radial-gradient(circle at 10% 30%, rgba(217,181,109,.08), transparent 25%),
        var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(92%, var(--max));
      margin: auto;
    }


    /* ================================
       NAVBAR
       ================================ */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(7,17,31,.78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 26px;
      list-style: none;
      font-size: 14px;
      color: var(--muted);
    }

    .nav-links a:hover {
      color: var(--white);
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: 0;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

       HERO
       ================================ */

    }
