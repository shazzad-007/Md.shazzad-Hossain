<style>
:root{
    --bg:#050816;
    --bg2:#0a1022;
    --card:rgba(255,255,255,.055);
    --card-border:rgba(255,255,255,.10);
    --text:#f5f7ff;
    --muted:#aeb7ca;
    --blue:#1687ff;
    --blue2:#00b7ff;
    --gold:#f4c95d;
    --green:#45e0a2;
    --max:1150px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(circle at 80% 10%,rgba(0,120,255,.13),transparent 30%),
        radial-gradient(circle at 10% 30%,rgba(0,190,255,.07),transparent 28%),
        var(--bg);
    color:var(--text);
    line-height:1.7;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(var(--max),92%);
    margin:auto;
}

/* NAVIGATION */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,8,22,.82);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.nav-inner{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:20px;
    font-weight:800;
    color:white;
}

.logo span{
    color:var(--blue);
}

.nav-links{
    display:flex;
    gap:26px;
    list-style:none;
}

.nav-links a{
    color:#d7deed;
    font-size:14px;
    font-weight:600;
    transition:.25s;
}

.nav-links a:hover{
    color:var(--blue2);
}

.menu{
    display:none;
    font-size:28px;
    cursor:pointer;
}

/* HERO */

.hero{
    min-height:calc(100vh - 76px);
    display:grid;
    grid-template-columns:1.15fr .85fr;
    align-items:center;
    gap:60px;
    padding:80px 0;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 15px;
    border:1px solid rgba(0,150,255,.35);
    background:rgba(0,120,255,.09);
    border-radius:50px;
    color:#66c6ff;
    font-size:13px;
    font-weight:700;
    margin-bottom:24px;
}

.dot{
    width:8px;
    height:8px;
    background:#28a8ff;
    border-radius:50%;
    box-shadow:0 0 12px #28a8ff;
}

.hero h1{
    font-size:clamp(43px,6vw,76px);
    line-height:1.02;
    letter-spacing:-3px;
    margin-bottom:22px;
}

.hero h1 .blue{
    color:var(--blue);
}
